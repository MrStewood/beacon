<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon Widget</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5}
        .widget{max-width:100%;padding:0}
        .header{padding:12px 16px;font-weight:600;font-size:15px}
        .light .header{background:#1d4ed8;color:#fff}
        .dark .header{background:#3b82f6;color:#fff}
        .list{max-height:350px;overflow-y:auto}
        .item{padding:10px 16px;border-bottom:1px solid #e2e8f0}
        .dark .item{border-color:#334155}
        .item:last-child{border-bottom:none}
        .name{font-weight:500;margin-bottom:2px}
        .name a{color:#1d4ed8;text-decoration:none}
        .name a:hover{text-decoration:underline}
        .dark .name a{color:#60a5fa}
        .meta{font-size:12px;color:#64748b}
        .dark .meta{color:#94a3b8}
        .tags{margin-top:4px}
        .tag{display:inline-block;background:#dbeafe;color:#1e40af;padding:1px 6px;border-radius:99px;font-size:11px;font-weight:500;margin-right:4px}
        .footer{padding:8px 16px;font-size:11px;text-align:center;border-top:1px solid #e2e8f0}
        .light .footer{background:#f8fafc;color:#64748b}
        .dark .footer{background:#020617;color:#94a3b8;border-color:#334155}
        .footer a{color:#1d4ed8;text-decoration:none}
        .loading{padding:24px;text-align:center;color:#64748b}
    </style>
</head>
<body>
<div class="widget light" id="widget">
    <div class="loading">Loading…</div>
</div>
<script>
(function(){
    const params=new URLSearchParams(location.search);
    const county=params.get('county')||'';
    const need=params.get('need')||'';
    const theme=params.get('theme')||'light';
    const limit=parseInt(params.get('limit')||'10');
    const NL={addiction:"Addiction & Recovery",clothing:"Clothing & Supplies",community:"Community",crisis:"Crisis & Safety",documents:"ID & Documents",education:"Education",family:"Family & Children",food:"Food & Water",health:"Healthcare",housing:"Housing",jobs:"Jobs & Income",legal:"Legal Aid","mental-health":"Mental Health",shelter:"Shelter & Sleep",transportation:"Transportation",veterans:"Veterans"};
    function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    fetch('https://mrstewood.github.io/beacon/data/resources.json')
        .then(r=>r.json()).then(d=>{
            let res=d.resources;
            if(county)res=res.filter(r=>r.county===county);
            if(need)res=res.filter(r=>r.needs.includes(need));
            res=res.slice(0,limit);
            const hdr=[county?county+' County':'',need?(NL[need]||need):'','Resources'].filter(Boolean).join(' ');
            let h=`<div class="widget ${theme}"><div class="header">${esc(hdr)}</div><div class="list">`;
            if(!res.length)h+='<div class="item">No resources found.</div>';
            else res.forEach(r=>{
                const ph=r.phones&&r.phones.length?`📞 <a href="tel:${esc(r.phones[0])}">${esc(r.phones[0])}</a>`:'';
                const lk=r.url?` · <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Website</a>`:'';
                const tags=r.needs.slice(0,3).map(n=>`<span class="tag">${esc(NL[n]||n)}</span>`).join('');
                h+=`<div class="item"><div class="name"><a href="https://mrstewood.github.io/beacon/pages/resource/${r.id}.html" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a></div><div class="meta">${ph}${lk}${r.address&&r.address!=='Statewide'?'<br>📍 '+esc(r.address):''}</div>${tags?'<div class="tags">'+tags+'</div>':''}</div>`;
            });
            h+=`</div><div class="footer">Powered by <a href="https://mrstewood.github.io/beacon/" target="_blank" rel="noopener noreferrer">Beacon</a></div></div>`;
            document.getElementById('widget').outerHTML=h;
        }).catch(()=>{document.getElementById('widget').innerHTML='<div class="loading">Unable to load resources.</div>'});
})();
</script>
</body>
</html>

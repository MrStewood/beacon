name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install jsonschema pytest pyyaml
      - name: Build data (required for validate.py to read data/resources.json)
        run: python scripts/build.py
      - name: Validate schema
        run: python scripts/validate.py
      - name: Validate sources and workflow
        run: python scripts/validate_sources.py
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js && node --check assets/js/config.js
      - name: Run tests
        run: pytest tests/ -v
      - name: Validate candidates (if any exist)
        run: python scripts/validate_candidate.py --all

  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install jsonschema pytest pyyaml
      - name: Build all outputs and assemble _site/
        run: python scripts/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the assembled public site — never the whole repo.
          # source/candidates/, leads/, pilot/, scripts/, tests/ stay private.
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

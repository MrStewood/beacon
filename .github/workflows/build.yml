name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install jsonschema pytest pyyaml
      - name: Validate schema
        run: python scripts/validate.py
      - name: Validate sources and workflow
        run: python scripts/validate_sources.py
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js && node --check assets/js/config.js
      - name: Run tests
        run: pytest tests/ -v
      - name: Verify generated files match
        run: python scripts/build.py && git diff --exit-code -- data/ pages/ print/ sitemap.xml ':(exclude)data/change-report.json' || (echo "Generated files differ from committed" && exit 1)

  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install jsonschema pytest pyyaml
      - name: Build all outputs
        run: python scripts/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install jsonschema pytest pyyaml
      - name: Verify committed data is in sync with approved YAMLs
        run: |
          python scripts/build_from_yaml.py
          if ! git diff --exit-code data/resources.json data/v3/resources.json data/index.json; then
            echo "FAIL: committed data/resources.json is out of sync with source/approved/"
            echo "Run 'python scripts/build_from_yaml.py' locally and commit the result."
            exit 1
          fi
          echo "OK: committed data files match approved YAMLs"
      - name: Validate schema
        run: python scripts/validate.py
      - name: Validate sources and workflow
        run: python scripts/validate_sources.py
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js && node --check assets/js/config.js
      - name: Run tests
        run: pytest tests/ -v
      - name: Validate candidates (if any exist)
        run: python scripts/validate_candidate.py --all

  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install jsonschema pytest pyyaml
      - name: Generate pages and assemble _site/
        run: |
          python scripts/build_pages.py
          python scripts/build_print.py
          python scripts/build.py --assemble-only
      - name: Verify _site/data/resources.json exists and is non-empty
        run: |
          count=$(python3 -c "import json; d=json.load(open('_site/data/resources.json')); print(len(d.get('resources',[])))")
          if [ "$count" -eq 0 ]; then
            echo "FATAL: _site/data/resources.json has zero resources"
            exit 1
          fi
          echo "OK: _site/data/resources.json — $count resource(s)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

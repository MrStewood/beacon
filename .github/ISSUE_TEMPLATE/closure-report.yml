name: Closure Report
description: Report a service that is closed or unreachable
title: "[CLOSURE] "
labels: ["stage:needs-evidence", "type:closure", "risk:closure"]
body:
  - type: markdown
    attributes:
      value: |
        **Important:** A closure report creates a verification task. It does not automatically close the resource.

  - type: input
    id: resource_id
    attributes:
      label: Resource ID or Beacon URL
      placeholder: "ky-fayette-example-resource"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting Evidence
      description: How do you know this service is closed? (e.g., "Website returns 404", "Phone disconnected", "Building is empty")
    validations:
      required: true

  - type: input
    id: date_observed
    attributes:
      label: Date Observed
      placeholder: "2026-09-20"
    validations:
      required: true

  - type: dropdown
    id: evidence_type
    attributes:
      label: Type of Evidence
      options:
        - Website returns error or 404
        - Phone number disconnected
        - Physical location closed/empty
        - Organization announced closure
        - Other (describe below)

  - type: textarea
    id: additional
    attributes:
      label: Additional Details
